<meta name="description" content="During the first year of his second presidency, Donald Trump’s income has more than tripled. Whether that reflects profit from his institutional role or simple coincidence almost doesn’t matter. As both player and referee, he holds the power to shape the market his personal fortune depends on. That overlap raises a question about whether it is appropriate for him to keep controlling his personal business, but most of all, whether laws meant to prevent presidential conflicts of interest are adequate at all." />
